<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starry Budget</title>

    <!-- Nunito from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Favicons (files live in public/assets/favicon_io).
         %BASE_URL% is replaced by Vite with "/Starry-Budget/". -->
    <link rel="icon" href="%BASE_URL%assets/favicon_io/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%assets/favicon_io/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%assets/favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%assets/favicon_io/favicon-16x16.png" />
    <link rel="manifest" href="%BASE_URL%assets/favicon_io/site.webmanifest" />
    <meta name="theme-color" content="#5c5fd6" />
  </head>
  <body>
    <!-- React puts the whole app inside this div (see src/main.tsx) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
